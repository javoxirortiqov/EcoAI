{% load static %}

<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoAI — Rasm tahlili</title>
</head>
<body>

<h1>EcoAI</h1>

<h2>Ekologik rasm tahlili</h2>

<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}

    <input
        type="file"
        name="image"
        accept="image/png,image/jpeg"
        required
    >

    <button type="submit">
        Rasmni yuklash
    </button>
</form>

</body>
</html>
